name: Claude Code Review

on:
  pull_request:
    # 毎 push で走ると増分のたびに同じ指摘が積むので、synchronize は入れない。
    # 自動で走らせるのは開いた一度だけ（draft から上げた ready_for_review と、閉じて開き直した reopened も同じ一度に当たる）。
    # 以後の再レビューは PR コメントの @claude で明示的に呼ぶ。
    types: [opened, ready_for_review, reopened]

jobs:
  claude-review:
    # fork からの PR では GitHub が GITHUB_TOKEN を read-only へ降格し、ワークフローが宣言した id-token: write を無視する。
    # ACTIONS_ID_TOKEN_REQUEST_URL が注入されず OIDC トークンを取れないので、action は Anthropic API へ到達する前に必ず落ちる。
    # 直しようのない赤い ✗ が残るだけなので、同一リポジトリ由来の PR に限る。
    # 見るのは author_association でなく head.repo。
    # シークレットと id-token が渡るかどうかを決めているのは fork かどうかであって、PR を出した人の権限ではない。
    # step でなく job に置く。
    # step だけを止めると job は成功で終わり、中身が空の成功と実際にレビューが走った成功を check 一覧で区別できなくなる。
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # group は claude.yml と分ける。
      # 同じ PR で @claude と自動レビューが同時に動いても、それぞれ自分のトラッキングコメントを持つので踏み合わない。
      group: claude-review-${{ github.event.pull_request.number }}
      # 同じ PR での多重起動は直列化する。
      # 走っている応答を途中で殺すと中途半端なトラッキングコメントが残り、レビューが走ったのか黙ったのかが読めなくなる。
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Claude が PR 上で CI の結果を読むのに要る

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # tag mode は mcp__github_ci__get_workflow_run_details を許可ツールへ自動で載せるので、これが無いと CI サーバの導入だけが飛ぶ。
          # レビューが check.yml の緑を確認したうえで書いているのかを区別できなくなるので、claude.yml と同じ二つを揃える。
          additional_permissions: |
            actions: read

          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # 既定の automation mode は指摘をインラインコメントにしか出さず、指摘がゼロだと何も残さない。
          # レビューが走ったのか読めずに黙ったのかを外から区別できないので、tag mode を強制してトラッキングコメントへ結果を書かせる。
          track_progress: true

          # 言語指定は prompt でなく system prompt へ置く。prompt の中身はスラッシュコマンドの引数として解釈されうるので、指示が届く保証が無い。
          # 非対話モードでは allowedTools に無いツールが拒否されるので、差分を読むための git を名指しで開ける（履歴を書き換えるサブコマンドは渡さない）。
          # checkout が fetch-depth: 1 で origin/main を持たないため、origin/main...HEAD の差分には fetch が要る。
          # 連鎖したコマンドは && で分割して一つずつ照合されるので、fetch を落とすと diff の側が許可されていても前半で止まる。
          # /code-review はプラグインのスラッシュコマンドで、起動そのものが Skill ツールを通る。
          # Skill を開けないとコマンドの本体が一行も走らず、エージェントが即興でレビューを書く経路へ落ちる（2026-08-30 に実測）。
          # コマンド定義は手順 1〜5 をすべてサブエージェントへ分けるので、その起動（Agent）も要る。
          # ツール名は 2026-08-30 の実走で確かめた（Agent が 7 回・Task は 0 回）。
          # コマンド定義が frontmatter で宣言している gh の読み取りも開ける。
          # 本文が「GitHub とのやり取りは gh CLI で行い web fetch は使わない」と指定しており、PR の状態と差分の取得がここに乗っている。
          # 書き込み（gh pr comment）は開けない。
          # permissions が pull-requests: read で、Actions 経由の Claude はコメントまでという規約に当たる（要約の置き場は tag mode のトラッキングコメントが兼ねる）。
          # サブエージェントを背景で起動させない指示も system prompt へ置く。
          # 既定は背景で、メインのエージェントは完了通知を待ってターンを終えるが、非対話の実行ではその通知が来ないまま run が終わる（2026-08-30 に実測）。
          claude_args: '--allowedTools "Skill,Agent,TodoWrite,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git fetch:*)" --append-system-prompt "レビューの本文・要約・インラインコメントはすべて日本語で書く。文体は だ・である調。識別子・ルール名・パス・引用したコードは原文のまま残す。指摘が無い場合も、何を読んで問題無しと判断したかを要約として残す。サブエージェントは run_in_background を使わず、同じターンで結果を待って起動する。非対話で走るので完了通知が届かず、待つ形にすると結果を受け取れないまま終わる。レビュー結果は gh pr comment でなくトラッキングコメントへ書く。"'

      # run のサマリから外へ出るのは num_turns と permission_denials_count の数字だけで、
      # 何が拒否されたかは出ない。per-tool の記録を持つ claude-execution-output.json は
      # ランナーの一時領域に残るだけなので、run と一緒に消える。
      # 拒否が残り続けるとき allowlist の穴なのか別の要因なのかを分けられないので、ここで artifact へ出す。
      # 拒否を読みたいのは落ちた回でもあるので if: always()。
      # 中身にはレビュー本文と読んだ差分に加えて、途中の思考とツール呼び出しの引数が入る。
      # このリポジトリは public なので artifact も同じ範囲へ公開される。保持期間を既定の 90 日から 2 日へ切る
      # （拒否を調べるのはレビューの直後なので、2 日で足りる）。
      - name: Upload Claude execution output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-execution-output
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 2
