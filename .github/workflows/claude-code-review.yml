name: Claude Code Review

on:
  pull_request:
    # 毎 push で走ると増分のたびに同じ指摘が積むので、synchronize は入れない。
    # 自動で走らせるのは開いた一度だけ（draft から上げた ready_for_review と、閉じて開き直した reopened も同じ一度に当たる）。
    # 以後の再レビューは PR コメントの @claude で明示的に呼ぶ。
    types: [opened, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # 既定の automation mode は指摘をインラインコメントにしか出さず、指摘がゼロだと何も残さない。
          # レビューが走ったのか読めずに黙ったのかを外から区別できないので、tag mode を強制してトラッキングコメントへ結果を書かせる。
          track_progress: true
          # 言語指定は prompt でなく system prompt へ置く。prompt の中身はスラッシュコマンドの引数として解釈されうるので、指示が届く保証が無い。
          # 非対話モードでは allowedTools に無いツールが拒否されるので、差分を読むための git を名指しで開ける（履歴を書き換える綴りは渡さない）。
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*),Bash(git rev-parse:*)" --append-system-prompt "レビューの本文・要約・インラインコメントはすべて日本語で書く。文体は だ・である調。識別子・ルール名・パス・引用したコードは原文のまま残す。指摘が無い場合も、何を読んで問題無しと判断したかを要約として残す。"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

