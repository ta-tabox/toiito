name: Claude Code

# issue 本文は仕様書で、そこに手順として「@claude を呼ぶ」と書くと言及と起動を綴りで区別できないので、issues トリガは持たない。
# 起動はコメント（issue_comment / pull_request_review_comment / pull_request_review）だけ。
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # 公開後は誰でもコメントできるので、リポジトリに招かれた人だけに起動を絞る（絞らないと API 利用料と Actions 分を第三者が自由に燃やせる）。
    # ただし COLLABORATOR が意味するのは招待されたことだけなので、Read や Triage で招いた相手も通る。
    # 実権限で弾くには Permission API を引く別ステップが要り、if: の式には書けない。
    # 招くのは Write 以上だけ、という運用でこの差を埋める。
    # 見るのは「@claude と書いた本人」の association で、それが載っているオブジェクトは経路ごとに違う。
    # issue_comment と pull_request_review_comment はコメント側（github.event.comment）、pull_request_review はレビュー側（github.event.review）。
    # issue_comment で github.event.issue.author_association を見てはいけない。
    # それは issue を立てた人のもので後から誰がコメントしても変わらないので、OWNER が立てた issue へのコメントが権限を問わず全部通る。
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      # 同じ issue/PR での連投は直列化する。走っている応答を途中で殺すと中途半端なコメントが残るので cancel はしない。
      cancel-in-progress: false
    permissions:
      # contents: read で固定する（Actions 経由の Claude はコメントまで。コミットは押させない）。
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Claude が PR 上で CI の結果を読むのに要る

    # ここから下の実行環境は check.yml の複製。
    # 二本しか無いので共通化しない（合成アクションに切り出すと、この job が何を持っているかが読めなくなる）。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: toiito
          POSTGRES_PASSWORD: toiito
          POSTGRES_DB: toiito
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U toiito -d toiito"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://toiito:toiito@localhost:5433/toiito
      DIRECT_URL: postgresql://toiito:toiito@localhost:5433/toiito
      TOIITO_TEST_DATABASE_URL: postgresql://toiito:toiito@localhost:5433/toiito_test
      # ここは無人で回る経路なので、実 Claude API を叩かせない（HARNESS.md「意図的にやらないこと」）。
      TOIITO_FAKE_AI: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # node と pnpm を mise.toml の版で入れる。corepack は使わない（CLAUDE.md 開発ハーネス）。
      - uses: jdx/mise-action@v4

      # service コンテナには docker/initdb をマウントできないので、同じ SQL をここで打つ。
      - name: テスト用データベースを作る
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'create database toiito_test owner toiito'

      # postinstall が prisma generate まで走らせる（生成クライアントは git 管理外）。
      - name: 依存を入れる
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Claude に PR 上の CI 結果を読ませる
          additional_permissions: |
            actions: read

          # check に要る三つだけを名指しする（`Bash(pnpm *)` のようなワイルドカードでは開けすぎる）。
          # このアクションはリポジトリルートで走り、そこに package.json は無いので、web へ降りる `cd` も要る（`cd` 単体では何も起きないので、手元の `.claude/settings.json` と同じく綴りは絞らない）。
          # 連鎖したコマンドは `&&` で分割して一つずつ照合されるので、`cd web && pnpm check` はこの四つで通る。
          claude_args: '--allowed-tools "Bash(cd:*),Bash(pnpm check),Bash(pnpm lint),Bash(pnpm test)"'
